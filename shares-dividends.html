<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dividends — Share Holdings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="sb-backdrop" id="sbBackdrop"></div>
  <div class="content">
    <div class="content-head">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="menu-btn" id="menuBtn">&#9776;</button>
        <div class="ch-title">Dividend Payouts</div>
      </div>
      <button class="btn-primary" onclick="openDivModal()">+ Add Dividend</button>
    </div>
    <div class="page">
      <div id="kpiHost"></div>
      <div class="filters">
        <div class="ms" id="dvYear"></div>
        <div class="ms" id="dvWallet"></div>
        <div class="ms" id="dvDest"></div>
        <div class="ms" id="dvCcy"></div>
        <div class="ms" id="dvStock"></div>
        <button class="btn-sm" id="dvClear" onclick="clearDvFilters()" style="display:none;">Clear filters</button>
      </div>
      <div class="table-wrap">
        <table class="std">
          <thead><tr>
            <th>Payout Date</th><th>Ticker</th><th>Stock Name</th><th>Wallet</th><th>Paid To</th>
            <th class="num">Amount</th><th></th>
          </tr></thead>
          <tbody id="divBody"></tbody>
          <tfoot id="divFoot"></tfoot>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- DIVIDEND MODAL -->
<div class="modal-overlay" id="divModal">
  <div class="modal">
    <div class="modal-title" id="divModalTitle">Add Dividend</div>
    <div class="form-section">
      <div class="form-section-title">Dividend Details</div>
      <div class="form-grid g2">
        <div class="field"><label>Payout Date</label><input type="date" id="dDate"></div>
        <div class="field"><label>Amount received (<span id="dAmtCcy">MYR</span>)</label><input type="number" id="dAmount" placeholder="0.00" min="0" step="any"></div>
        <div class="field"><label>Stock Code</label>
          <input type="text" id="dTicker" list="divTickerList" placeholder="e.g. 1155" autocomplete="off" oninput="onDivTickerInput()">
          <datalist id="divTickerList"></datalist>
        </div>
        <div class="field"><label>Stock Name</label><input type="text" id="dName" placeholder="Auto-filled…"></div>
        <div class="field full"><label>Paid from wallet</label>
          <select id="dWallet" onchange="onDvWalletChange()">
            <option value="">Auto — work out from holdings</option>
            <option value="MYB-MYR">MYB-MYR → into Maybank CDS wallet (MYR)</option>
            <option value="MYB-USD">MYB-USD → into Maybank CDS wallet (USD)</option>
            <option value="RKT-MYR">RKT-MYR → into Rakuten CDS wallet (MYR)</option>
            <option value="RKT-USD">RKT-USD → into Rakuten CDS wallet (USD)</option>
            <option value="RHB-MYR">RHB-MYR → to Maybank savings (MYR)</option>
            <option value="RHB-USD">RHB-USD → to Maybank savings (USD)</option>
          </select>
        </div>
        <div class="field full"><label>Note (optional)</label>
          <input type="text" id="dBanked" placeholder="e.g. MaybankIB, voucher no.">
        </div>
      </div>
    </div>
    <div class="modal-err" id="divErr"></div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeDivModal()">Cancel</button>
      <button class="btn-save" id="divSaveBtn" onclick="saveDividend()">Save Dividend</button>
    </div>
  </div>
</div>

<script src="assets/common.js"></script>
<script src="assets/multiselect.js?v=2"></script>
<script src="assets/shares.js?v=14"></script>
<script>
requireAuth();
buildSidebar('dividends');
document.getElementById('kpiHost').innerHTML=`
  <div class="summary-grid">
    <div class="tile"><div class="tile-label">Total Dividends</div><div class="tile-value" id="dkTotal">—</div><div class="tile-sub" id="dkTotalSub" style="font-size:10px;"></div></div>
    <div class="tile"><div class="tile-label">Dividends YTD</div><div class="tile-value" id="dkYTD">—</div><div class="tile-sub" id="dkYTDSub"></div></div>
    <div class="tile"><div class="tile-label">Last Year</div><div class="tile-value" id="dkLastYr">—</div><div class="tile-sub" id="dkLastYrSub"></div></div>
    <div class="tile"><div class="tile-label">Average / Year</div><div class="tile-value" id="dkAvg">—</div><div class="tile-sub" id="dkAvgSub"></div></div>
    <div class="tile"><div class="tile-label">Top Payer</div><div class="tile-value" id="dkTop">—</div><div class="tile-sub" id="dkTopSub"></div></div>
    <div class="tile"><div class="tile-label">Latest Payout</div><div class="tile-value" id="dkLast">—</div><div class="tile-sub" id="dkLastSub"></div></div>
  </div>
  <div id="divFilterNote" style="display:none;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#00a19c;margin:-8px 0 14px;">&#9679; Filtered view — cards reflect active filters</div>`;

/* ═══ Payout lines ═══
   Each dividend row becomes one or more payout lines via allocateDividends() (shares.js):
   MYB-* and RKT-* dividends are paid into that wallet; RHB-* dividends go to Maybank savings.
   Rows without a wallet are split by holdings on the payout date ("auto").                    */
const DV_FILTERS=['dvYear','dvWallet','dvDest','dvCcy','dvStock'];
const DV_META={dvYear:{noun:'Years',allLabel:'All Years'},dvWallet:{noun:'Wallets',allLabel:'All Wallets'},
  dvDest:{noun:'Paid to',allLabel:'All Destinations'},dvCcy:{noun:'Currency',allLabel:'All Currencies'},dvStock:{noun:'Stocks',allLabel:'All Stocks'}};
const dvOptKey={};
function divFx(){return (typeof kpiFx!=='undefined'&&kpiFx)?kpiFx:null;}
function lineMyr(l){return l.ccy==='USD'?(divFx()?l.amount*divFx():null):l.amount;}
function payoutLines(){
  return allocateDividends(dividends,transactions).map(x=>({
    ...x, id:x.div.id, date:x.div.payout_date, year:String(new Date(x.div.payout_date).getFullYear()),
    ticker:x.div.ticker, name:x.div.stock_name||x.div.ticker,
    wallet:x.cds?`${x.cds}-${x.ccy}`:'Unassigned',
    dest:!x.cds?'Unassigned':(x.toWallet?'CDS wallet':'Maybank savings'),
    auto:!x.div.cds_account
  }));
}
function dvField(l,id){return {dvYear:l.year,dvWallet:l.wallet,dvDest:l.dest,dvCcy:l.ccy,dvStock:l.ticker}[id];}
function dvPasses(l,skip){return DV_FILTERS.every(id=>id===skip||!MS.exists(id)||MS.has(id,dvField(l,id)));}
function dvOptions(id,lines){
  const rows=lines.filter(l=>dvPasses(l,id));
  if(id==='dvStock')return [...new Map(rows.map(l=>[l.ticker,{value:l.ticker,label:`${l.ticker} — ${l.name}`}])).values()].sort((a,b)=>a.value.localeCompare(b.value));
  const v=[...new Set(rows.map(l=>dvField(l,id)))];
  const order={dvWallet:['MYB-MYR','MYB-USD','RKT-MYR','RKT-USD','RHB-MYR','RHB-USD','Unassigned'],dvDest:['CDS wallet','Maybank savings','Unassigned'],dvCcy:['MYR','USD']}[id];
  if(id==='dvYear')return v.sort((a,b)=>b-a);
  return order?order.filter(x=>v.includes(x)).concat(v.filter(x=>!order.includes(x))):v.sort();
}
function populateDivFilters(){
  const lines=payoutLines();
  for(let pass=0;pass<3;pass++){
    let changed=false;
    DV_FILTERS.forEach(id=>{
      const opts=dvOptions(id,lines), key=JSON.stringify(opts);
      if(MS.exists(id)&&dvOptKey[id]===key)return;
      dvOptKey[id]=key;changed=true;
      MS.init(id,Object.assign({},DV_META[id],{options:opts,onChange:onDvFilterChange}));
    });
    if(!changed)break;
  }
  document.getElementById('dvClear').style.display=DV_FILTERS.some(id=>MS.active(id))?'':'none';
}
function onDvFilterChange(){populateDivFilters();refreshDivView();}
function clearDvFilters(){MS.clear(DV_FILTERS,onDvFilterChange);}
function getFilteredLines(){
  const lines=payoutLines().filter(l=>dvPasses(l,null));
  lines.sort((a,b)=>b.date.localeCompare(a.date)||a.ticker.localeCompare(b.ticker));
  return {list:lines,active:DV_FILTERS.some(id=>MS.exists(id)&&MS.active(id))};
}
function refreshDivView(){renderDividends();renderDivKPIs();}

function renderDivKPIs(){
  const {list,active}=getFilteredLines();
  const badge=document.getElementById('divFilterNote');
  if(badge)badge.style.display=active?'block':'none';
  if(!list.length){
    ['dkTotal','dkYTD','dkLastYr','dkAvg','dkTop','dkLast'].forEach(id=>setText(id,'—'));
    ['dkTotalSub','dkYTDSub','dkLastYrSub','dkAvgSub','dkTopSub','dkLastSub'].forEach(id=>setText(id,''));
    return;
  }
  const now=new Date().getFullYear();
  const byYear={},byStock={}; let total=0, toWal=0, toSav=0, pending=0;
  list.forEach(l=>{
    const m=lineMyr(l); if(m==null){pending++;return;}
    const y=+l.year; total+=m; byYear[y]=(byYear[y]||0)+m; byStock[l.name]=(byStock[l.name]||0)+m;
    if(l.dest==='CDS wallet')toWal+=m; else if(l.dest==='Maybank savings')toSav+=m;
  });
  const pastYears=Object.keys(byYear).map(Number).filter(y=>y<now);
  const avg=pastYears.length?pastYears.reduce((s,y)=>s+byYear[y],0)/pastYears.length:0;
  const top=Object.entries(byStock).sort((a,b)=>b[1]-a[1])[0]||['—',0];
  const latest=list[0];
  setText('dkTotal','MYR '+fmt(total));
  setText('dkTotalSub',`into wallets MYR ${fmt(toWal)} · Maybank savings MYR ${fmt(toSav)}`+(pending?` · ${pending} USD pending rate`:''));
  setText('dkYTD','MYR '+fmt(byYear[now]||0)); setText('dkYTDSub',String(now));
  setText('dkLastYr','MYR '+fmt(byYear[now-1]||0)); setText('dkLastYrSub',String(now-1));
  setText('dkAvg','MYR '+fmt(avg)); setText('dkAvgSub',pastYears.length+' year'+(pastYears.length!==1?'s':'')+' (excl. '+now+')');
  setText('dkTop',top[0]); setText('dkTopSub','MYR '+fmt(top[1])+' cumulative');
  setText('dkLast',`${latest.ccy} ${fmt(latest.amount)}`);
  setText('dkLastSub',`${latest.name} · ${latest.wallet} · `+new Date(latest.date).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}));
}

let editingDivId=null;

function initDatalist(){
  const dl=document.getElementById('divTickerList');
  dl.innerHTML=[...BURSA_STOCKS,...US_STOCKS].map(s=>`<option value="${s.code}">${s.code} — ${s.name}</option>`).join('');
}
function onDivTickerInput(){
  const val=document.getElementById('dTicker').value.trim().toUpperCase();
  const match=[...BURSA_STOCKS,...US_STOCKS].find(s=>s.code===val||s.name===val);
  if(match){document.getElementById('dTicker').value=match.code;document.getElementById('dName').value=match.name;}
  onDvWalletChange();
}
function renderDividends(){
  const {list}=getFilteredLines();
  const tbody=document.getElementById('divBody'), foot=document.getElementById('divFoot');
  if(!list.length){tbody.innerHTML=`<tr><td colspan="7" class="empty-state">No dividends found.</td></tr>`;foot.innerHTML='';return;}
  tbody.innerHTML=list.map(l=>{
    const date=new Date(l.date).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
    const m=l.ccy==='USD'&&divFx()?`<div style="font-size:10px;color:var(--ink-dim);">≈ MYR ${fmt(l.amount*divFx())}</div>`:'';
    const destStyle=l.dest==='CDS wallet'?'color:#00514d;':l.dest==='Maybank savings'?'color:#7a5b00;':'color:#a4231a;';
    const autoTag=l.auto&&l.cds?`<span title="No wallet on this row — split by units held on the payout date" style="font-size:9px;font-weight:700;color:var(--ink-dim);border:1px solid var(--panel-edge);border-radius:6px;padding:0 4px;margin-left:4px;">auto${Number(l.div.amount)!==l.amount?' split':''}</span>`:'';
    return `<tr>
      <td style="font-family:'IBM Plex Mono',monospace;font-size:11px;white-space:nowrap;">${date}</td>
      <td><div class="ticker-cell">${l.ticker}</div></td>
      <td style="font-size:12px;">${l.name}${l.div.banked_to?`<div style="font-size:10px;color:var(--ink-dim);">${l.div.banked_to}</div>`:''}</td>
      <td style="font-size:11px;font-weight:700;white-space:nowrap;">${l.wallet}${autoTag}</td>
      <td style="font-size:11px;font-weight:700;${destStyle}">${l.dest==='CDS wallet'?'&#8594; '+l.wallet+' wallet':l.dest}</td>
      <td class="num" style="color:var(--gold);font-family:'IBM Plex Mono',monospace;white-space:nowrap;">${l.ccy} ${fmt(l.amount)}${m}</td>
      <td><div class="action-btns">
        <button class="btn-sm" onclick="editDividend('${l.id}')">Edit</button>
        <button class="btn-sm btn-del" onclick="deleteDividend('${l.id}')">Del</button>
      </div></td>
    </tr>`;
  }).join('');
  // totals of the shown lines, per currency, split by destination
  const T={};
  list.forEach(l=>{const t=T[l.ccy]=T[l.ccy]||{n:0,all:0,wal:0,sav:0,un:0};t.n++;t.all+=l.amount;
    if(l.dest==='CDS wallet')t.wal+=l.amount;else if(l.dest==='Maybank savings')t.sav+=l.amount;else t.un+=l.amount;});
  foot.innerHTML=Object.keys(T).sort().map((c,i)=>{const t=T[c];return `<tr class="total-row">
    <td colspan="3" style="font-weight:800;">${i===0?'TOTAL (shown rows)':''}</td>
    <td colspan="2" style="font-size:11px;color:var(--ink-dim);white-space:nowrap;">${t.n} row${t.n!==1?'s':''} · into wallets ${c} ${fmt(t.wal)} · Maybank savings ${c} ${fmt(t.sav)}${t.un?` · unassigned ${c} ${fmt(t.un)}`:''}</td>
    <td class="num" style="font-weight:800;white-space:nowrap;">${c} ${fmt(t.all)}${c==='USD'&&divFx()?`<div style="font-size:10px;color:var(--ink-dim);">≈ MYR ${fmt(t.all*divFx())}</div>`:''}</td><td></td></tr>`;}).join('');
}
function openDivModal(id){
  editingDivId=id||null;
  setText('divModalTitle',id?'Edit Dividend':'Add Dividend');
  setText('divSaveBtn',id?'Save Changes':'Save Dividend');
  setText('divErr','');
  if(id){
    const d=dividends.find(x=>x.id===id);
    document.getElementById('dDate').value=d.payout_date;
    document.getElementById('dTicker').value=d.ticker;
    document.getElementById('dName').value=d.stock_name||'';
    document.getElementById('dAmount').value=d.amount;
    document.getElementById('dBanked').value=d.banked_to||'';
    document.getElementById('dWallet').value=d.cds_account?`${normCds(d.cds_account)}-${d.currency==='USD'?'USD':'MYR'}`:'';
    setText('dAmtCcy',d.currency==='USD'?'USD':'MYR');
  } else {
    document.getElementById('dDate').value=new Date().toISOString().split('T')[0];
    ['dTicker','dName','dBanked','dWallet'].forEach(id=>document.getElementById(id).value='');
    setText('dAmtCcy','MYR');
    document.getElementById('dAmount').value='';
  }
  document.getElementById('divModal').classList.add('open');
}
function editDividend(id){openDivModal(id);}
function onDvWalletChange(){const w=document.getElementById('dWallet').value;setText('dAmtCcy',w?w.split('-')[1]:dvGuessCcy(document.getElementById('dTicker').value.trim().toUpperCase()));}
function dvGuessCcy(tk){const t=transactions.find(x=>x.ticker===tk);return (t&&t.market==='US')||US_STOCKS.some(u=>u.code===tk)?'USD':'MYR';}
function closeDivModal(){document.getElementById('divModal').classList.remove('open');editingDivId=null;}

async function saveDividend(){
  const date=document.getElementById('dDate').value;
  const ticker=document.getElementById('dTicker').value.trim().toUpperCase();
  const name=document.getElementById('dName').value.trim();
  const amount=parseFloat(document.getElementById('dAmount').value);
  const banked=document.getElementById('dBanked').value.trim();
  const errEl=document.getElementById('divErr');
  if(!date){errEl.textContent='Select a payout date.';return;}
  if(!ticker){errEl.textContent='Enter a ticker.';return;}
  if(!amount||amount<=0){errEl.textContent='Enter a valid amount.';return;}
  const btn=document.getElementById('divSaveBtn');
  btn.disabled=true;btn.textContent='Saving…';
  const yr=new Date(date).getFullYear();
  const w=document.getElementById('dWallet').value;
  const cds=w?w.split('-')[0]:null;
  const currency=w?w.split('-')[1]:dvGuessCcy(ticker);        // Auto: US stock → USD, else MYR
  const payload={ticker,stock_name:name||null,payout_date:date,year:yr,amount,banked_to:banked||null,cds_account:cds,currency};
  let error;
  if(editingDivId){({error}=await sb.from('dividends').update(payload).eq('id',editingDivId));}
  else{({error}=await sb.from('dividends').insert(payload));}
  btn.disabled=false;btn.textContent=editingDivId?'Save Changes':'Save Dividend';
  if(error){errEl.textContent=error.message;return;}
  closeDivModal();showToast('Dividend saved ✓');loadShares();
}
async function deleteDividend(id){
  if(!confirm('Delete this dividend entry?'))return;
  const{error}=await sb.from('dividends').delete().eq('id',id);
  if(error){showToast('Delete failed');return;}
  showToast('Deleted ✓');loadShares();
}

window.onSharesData=function(){initDatalist();populateDivFilters();refreshDivView();};
window.onPricesUpdated=function(){refreshDivView();};   // USD dividends re-valued once the rate arrives
document.getElementById('divModal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeDivModal();});
loadShares();
</script>
</body>
</html>
