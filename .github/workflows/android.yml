name: Build Android app

# Builds the Markets Suite APK from the same web files GitHub Pages serves.
# All build steps live in mobile/ci-build.sh. Runs on push, or manually ("Run workflow").
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'assets/**'
      - 'mobile/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build + sign APK
        env:
          RUN_NUMBER: ${{ github.run_number }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: bash mobile/ci-build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: MarketsSuite-1.0.${{ github.run_number }}
          path: mobile/out/*.apk
          retention-days: 30
