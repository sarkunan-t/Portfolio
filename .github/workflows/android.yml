name: Build Android app

# Builds the Markets Suite APK from the same web files GitHub Pages serves.
# Runs when app files change, or manually from the Actions tab ("Run workflow").
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'assets/**'
      - 'mobile/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: npm ci --no-audit --no-fund

      - name: Build web bundle (www)
        run: bash build-www.sh

      - name: Create Android project
        run: npx cap add android

      - name: App icon + splash
        run: npx @capacitor/assets generate --android --assetPath resources

      - name: Harden + version the app
        run: |
          # don't let Android copy app data (login session) into cloud backups
          sed -i 's/android:allowBackup="true"/android:allowBackup="false"/' android/app/src/main/AndroidManifest.xml
          grep -q 'allowBackup="false"' android/app/src/main/AndroidManifest.xml
          # every build gets a higher version so it installs over the previous one
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Sync web bundle into Android
        run: npx cap sync android

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          IN=android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -f -p 4 "$IN" "$RUNNER_TEMP/aligned.apk"
          mkdir -p out
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KS_PASS \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KS_PASS \
            --out "out/MarketsSuite-1.0.${{ github.run_number }}.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify "out/MarketsSuite-1.0.${{ github.run_number }}.apk"
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: MarketsSuite-1.0.${{ github.run_number }}
          path: mobile/out/*.apk
          retention-days: 30
