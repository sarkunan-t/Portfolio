name: NASDAQ growth scanner

# Daily after the US close: 22:40 UTC = 06:40 Malaysia time, Tuesday–Saturday (covers Mon–Fri sessions).
# Results go to Supabase and show up in the app under More → Growth scanner.
# Run it by hand from the Actions tab ("Run workflow"), e.g. with backfill_weeks = 26 the first time.
on:
  schedule:
    - cron: '40 22 * * 1-5'
  workflow_dispatch:
    inputs:
      backfill_weeks:
        description: 'Also rebuild this many weeks of weekly score history (0 = none; 26 for the first run)'
        default: '0'
      symbols:
        description: 'Only these symbols, comma-separated (blank = whole NASDAQ)'
        default: ''

concurrency:
  group: scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scanner/requirements.txt
      - run: pip install -r scanner/requirements.txt
      - name: Offline self-test
        run: python scanner/tests/test_engine.py > /dev/null
      - name: Scan
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python scanner/run_scan.py \
            --backfill-weeks "${{ github.event.inputs.backfill_weeks || '0' }}" \
            ${{ github.event.inputs.symbols && format('--symbols "{0}"', github.event.inputs.symbols) || '' }}
