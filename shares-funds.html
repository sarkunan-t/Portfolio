<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Funds Invested — Share Holdings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="sb-backdrop" id="sbBackdrop"></div>
  <div class="content">
    <div class="content-head">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="menu-btn" id="menuBtn">&#9776;</button>
        <div>
          <div class="ch-title">Funds Invested</div>
          <div class="ch-sub" id="fdCount"></div>
        </div>
      </div>
      <button class="btn-primary" onclick="openFdModal()">+ Add Movement</button>
    </div>
    <div class="page">

      <div class="summary-grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr));">
        <div class="tile"><div class="tile-label">Available Capital</div><div class="tile-value" id="fkAvail">—</div><div class="tile-sub">net funds in − net invested in shares</div></div>
        <div class="tile"><div class="tile-label">Net Capital Invested</div><div class="tile-value" id="fkNet">—</div><div class="tile-sub">deposits − withdrawals</div></div>
        <div class="tile"><div class="tile-label">Net Capital Withdrawn</div><div class="tile-value" id="fkWdTotal">—</div><div class="tile-sub" id="fkWdTotalSub"></div></div>
      </div>
      <div id="fdFilterNote" style="display:none;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#00a19c;margin:-8px 0 14px;">&#9679; Filtered view — cards reflect active filters</div>

      <div class="table-wrap" style="padding:16px 18px;margin-bottom:16px;">
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:8px;">
          <div style="font-size:13px;font-weight:800;">Year-on-Year Flow</div>
          <div style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-dim);">
            <span style="color:#00a19c;">&#9632;</span> Deposits &nbsp;
            <span style="color:#d93025;">&#9632;</span> Withdrawals
          </div>
        </div>
        <div id="fdChart" style="overflow-x:auto;"></div>
      </div>

      <div class="filters">
        <select class="filter-select" id="fdFilterYear" onchange="refreshFdView()"><option value="">All Years</option></select>
        <select class="filter-select" id="fdFilterCDS" onchange="refreshFdView()"><option value="">All CDS</option></select>
        <select class="filter-select" id="fdFilterBank" onchange="refreshFdView()"><option value="">All Bank Accounts</option></select>
        <select class="filter-select" id="fdFilterType" onchange="refreshFdView()"><option value="">All Types</option><option value="Deposit">Deposit</option><option value="Withdraw">Withdraw</option></select>
      </div>

      <div class="table-wrap">
        <table class="std">
          <thead><tr>
            <th>Date</th><th>Type</th><th>CDS</th><th>Bank Account</th>
            <th class="num">Amount (MYR)</th><th>Notes</th><th></th>
          </tr></thead>
          <tbody id="fdBody"></tbody>
          <tfoot id="fdFoot"></tfoot>
        </table>
      </div>

    </div>
  </div>
</div>

<!-- FUNDS MODAL -->
<div class="modal-overlay" id="fdModal">
  <div class="modal">
    <div class="modal-title" id="fdModalTitle">Add Movement</div>
    <div class="form-section">
      <div class="field"><label>Type</label>
        <div class="toggle-row">
          <button class="toggle-btn active-buy" id="fdTypeDep" onclick="setFdType('Deposit')">&#9650; Deposit</button>
          <button class="toggle-btn" id="fdTypeWd" onclick="setFdType('Withdraw')">&#9660; Withdraw</button>
        </div>
      </div>
    </div>
    <div class="form-section">
      <div class="form-section-title">Details</div>
      <div class="form-grid g2">
        <div class="field"><label>Date</label><input type="date" id="fdDate"></div>
        <div class="field"><label>Amount (MYR)</label><input type="number" id="fdAmount" placeholder="0.00" min="0" step="any"></div>
        <div class="field"><label>CDS Account</label>
          <select id="fdCDS">
            <option value="MYB">Maybank (MYB)</option>
            <option value="RHB">RHB</option>
            <option value="RKT">Rakuten (RKT)</option>
          </select>
        </div>
        <div class="field"><label>Bank Account</label>
          <input type="text" id="fdBank" list="fdBankList" placeholder="e.g. Maybank" autocomplete="off">
          <datalist id="fdBankList"></datalist>
        </div>
        <div class="field full"><label>Notes (optional)</label><input type="text" id="fdNotes" placeholder="e.g. Dividend reinvested"></div>
      </div>
    </div>
    <div class="modal-err" id="fdErr"></div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeFdModal()">Cancel</button>
      <button class="btn-save" id="fdSaveBtn" onclick="saveFund()">Save Movement</button>
    </div>
  </div>
</div>

<script src="assets/common.js"></script>
<script src="assets/shares.js"></script>
<script>
requireAuth();
buildSidebar('funds');

let funds=[], fundsTx=[], editingFdId=null, fdType='Deposit';

/* ---- data ---- */
async function loadFunds(){
  const [fdRes,txRes]=await Promise.all([
    sb.from('funds').select('*').order('txn_date',{ascending:false}),
    sb.from('transactions').select('tx_date,tx_type,cds_account,net_amount')
  ]);
  if(fdRes.error){
    document.getElementById('fdBody').innerHTML=
      `<tr><td colspan="7" class="empty-state">Could not load — has the <b>funds</b> table been created in Supabase? (run funds-setup.sql)</td></tr>`;
    return;
  }
  funds=fdRes.data||[];
  fundsTx=txRes.data||[];
  populateFdFilters();
  refreshFdView();
}

/* ---- filters ---- */
function getFilteredFunds(){
  const g=id=>{const el=document.getElementById(id);return el?el.value:'';};
  const yrF=g('fdFilterYear'),cdsF=g('fdFilterCDS'),bnkF=g('fdFilterBank'),typF=g('fdFilterType');
  const list=funds.filter(f=>{
    if(yrF&&new Date(f.txn_date).getFullYear()!=yrF)return false;
    if(cdsF&&f.cds_account!==cdsF)return false;
    if(bnkF&&(f.bank_account||'')!==bnkF)return false;
    if(typF&&f.txn_type!==typF)return false;
    return true;
  });
  return {list,active:!!(yrF||cdsF||bnkF||typF)};
}
function populateFdFilters(){
  const keep=(sel,vals,label)=>{
    const cur=sel.value;
    sel.innerHTML=`<option value="">${label}</option>`+vals.map(v=>`<option value="${v}">${v}</option>`).join('');
    if(vals.map(String).includes(cur))sel.value=cur;
  };
  keep(document.getElementById('fdFilterYear'),
    [...new Set(funds.map(f=>new Date(f.txn_date).getFullYear()))].sort((a,b)=>b-a),'All Years');
  keep(document.getElementById('fdFilterCDS'),
    [...new Set(funds.map(f=>f.cds_account).filter(Boolean))].sort(),'All CDS');
  keep(document.getElementById('fdFilterBank'),
    [...new Set(funds.map(f=>f.bank_account).filter(Boolean))].sort(),'All Bank Accounts');
  const banks=[...new Set(funds.map(f=>f.bank_account).filter(Boolean))].sort();
  document.getElementById('fdBankList').innerHTML=banks.map(b=>`<option value="${b}">`).join('');
}
function refreshFdView(){renderFunds();renderFdKPIs();}

/* ---- cards + chart ---- */
function renderFdKPIs(){
  const {list,active}=getFilteredFunds();
  document.getElementById('fdFilterNote').style.display=active?'block':'none';
  const chartEl=document.getElementById('fdChart');
  if(!list.length){
    ['fkAvail','fkNet','fkWdTotal'].forEach(id=>setText(id,'—'));
    setText('fkWdTotalSub','');
    chartEl.innerHTML='<div class="empty-state" style="padding:30px 0;">No data</div>';
    return;
  }
  let dep=0,wd=0,wdN=0;
  const byYear={};
  list.forEach(f=>{
    const amt=Number(f.amount);
    const y=new Date(f.txn_date).getFullYear();
    if(!byYear[y])byYear[y]={dep:0,wd:0};
    if(f.txn_type==='Deposit'){
      dep+=amt;byYear[y].dep+=amt;
    } else {
      wd+=amt;byYear[y].wd+=amt;wdN++;
    }
  });
  const net=dep-wd;

  // Available capital: net funds in minus net cash used on shares,
  // matched to the same Year/CDS filters (bank & type filters apply to funds only)
  const g=id=>{const el=document.getElementById(id);return el?el.value:'';};
  const yrF=g('fdFilterYear'),cdsF=g('fdFilterCDS');
  let sharesNet=0;
  fundsTx.forEach(t=>{
    if(yrF&&new Date(t.tx_date).getFullYear()!=yrF)return;
    if(cdsF&&t.cds_account!==cdsF)return;
    sharesNet+=t.tx_type==='Buy'?Number(t.net_amount):-Number(t.net_amount);
  });
  const avail=net-sharesNet;
  setHTML('fkAvail',`<span class="${avail>=0?'up':'down'}">MYR ${fmt(avail)}</span>`);

  setHTML('fkNet',`<span class="${net>=0?'up':'down'}">MYR ${fmt(net)}</span>`);
  setHTML('fkWdTotal',wd>0?`<span class="down">MYR ${fmt(wd)}</span>`:'MYR 0.00');
  setText('fkWdTotalSub',wdN+' withdrawal'+(wdN!==1?'s':''));
  renderFdChart(byYear);
}

function renderFdChart(byYear){
  const chartEl=document.getElementById('fdChart');
  const years=Object.keys(byYear).map(Number).sort((a,b)=>a-b);
  const maxVal=Math.max(...years.map(y=>Math.max(byYear[y].dep,byYear[y].wd)),1);
  const kFmt=v=>v>=1000?(v/1000).toLocaleString('en-US',{maximumFractionDigits:v>=100000?0:1})+'k':String(Math.round(v));
  const groupW=86,barW=26,gap=6,padL=14,padR=14,padT=26,padB=26,chartH=150;
  const W=padL+years.length*groupW+padR, H=padT+chartH+padB;
  let bars='';
  years.forEach((y,i)=>{
    const gx=padL+i*groupW+(groupW-(barW*2+gap))/2;
    const d=byYear[y].dep,w=byYear[y].wd;
    const dh=Math.round(d/maxVal*chartH), wh=Math.round(w/maxVal*chartH);
    // deposit bar
    bars+=`<rect x="${gx}" y="${padT+chartH-dh}" width="${barW}" height="${Math.max(dh,d>0?2:0)}" rx="3" fill="#00a19c"/>`;
    if(d>0)bars+=`<text x="${gx+barW/2}" y="${padT+chartH-dh-5}" text-anchor="middle" font-size="9" font-family="IBM Plex Mono,monospace" fill="#00514d">${kFmt(d)}</text>`;
    // withdrawal bar
    bars+=`<rect x="${gx+barW+gap}" y="${padT+chartH-wh}" width="${barW}" height="${Math.max(wh,w>0?2:0)}" rx="3" fill="#d93025"/>`;
    if(w>0)bars+=`<text x="${gx+barW+gap+barW/2}" y="${padT+chartH-wh-5}" text-anchor="middle" font-size="9" font-family="IBM Plex Mono,monospace" fill="#a4231a">${kFmt(w)}</text>`;
    // year label
    bars+=`<text x="${padL+i*groupW+groupW/2}" y="${padT+chartH+17}" text-anchor="middle" font-size="10" font-weight="700" font-family="IBM Plex Mono,monospace" fill="#5f7674">${y}</text>`;
  });
  chartEl.innerHTML=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="display:block;min-width:${W}px;">
    <line x1="${padL-4}" y1="${padT+chartH}" x2="${W-padR+4}" y2="${padT+chartH}" stroke="#d8e4e2" stroke-width="1"/>
    ${bars}
  </svg>`;
}

/* ---- table ---- */
function renderFunds(){
  const {list}=getFilteredFunds();
  const tbody=document.getElementById('fdBody');
  const tfoot=document.getElementById('fdFoot');
  setText('fdCount',`${list.length} movement${list.length!==1?'s':''}`);
  if(!list.length){tbody.innerHTML=`<tr><td colspan="7" class="empty-state">No movements found.</td></tr>`;tfoot.innerHTML='';return;}
  let net=0;
  tbody.innerHTML=list.map(f=>{
    const date=new Date(f.txn_date).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
    const isDep=f.txn_type==='Deposit';
    net+=isDep?Number(f.amount):-Number(f.amount);
    const badge=isDep?`<span class="badge badge-buy">DEPOSIT</span>`:`<span class="badge badge-sell">WITHDRAW</span>`;
    return `<tr>
      <td style="font-family:'IBM Plex Mono',monospace;font-size:11px;white-space:nowrap;">${date}</td>
      <td>${badge}</td>
      <td style="font-size:11px;">${f.cds_account||'—'}</td>
      <td style="font-size:12px;">${f.bank_account||'—'}</td>
      <td class="num"><span class="${isDep?'up':'down'}">${isDep?'+':'−'}${fmt(f.amount)}</span></td>
      <td style="font-size:10px;color:var(--ink-dim);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${f.notes||'—'}</td>
      <td><div class="action-btns">
        <button class="btn-sm" onclick="editFund('${f.id}')">Edit</button>
        <button class="btn-sm btn-del" onclick="deleteFund('${f.id}')">Del</button>
      </div></td>
    </tr>`;
  }).join('');
  tfoot.innerHTML=`<tr class="total-row">
    <td colspan="4" style="text-align:right;font-weight:700;">NET (shown rows)</td>
    <td class="num"><span class="${net>=0?'up':'down'}">${net>=0?'+':'−'}${fmt(Math.abs(net))}</span></td>
    <td colspan="2"></td>
  </tr>`;
}

/* ---- modal ---- */
function setFdType(t){
  fdType=t;
  document.getElementById('fdTypeDep').className='toggle-btn'+(t==='Deposit'?' active-buy':'');
  document.getElementById('fdTypeWd').className='toggle-btn'+(t==='Withdraw'?' active-sell':'');
}
function openFdModal(id){
  editingFdId=id||null;
  setText('fdModalTitle',id?'Edit Movement':'Add Movement');
  setText('fdSaveBtn',id?'Save Changes':'Save Movement');
  setText('fdErr','');
  if(id){
    const f=funds.find(x=>x.id===id);
    setFdType(f.txn_type);
    document.getElementById('fdDate').value=f.txn_date;
    document.getElementById('fdAmount').value=f.amount;
    document.getElementById('fdCDS').value=f.cds_account||'MYB';
    document.getElementById('fdBank').value=f.bank_account||'';
    document.getElementById('fdNotes').value=f.notes||'';
  } else {
    setFdType('Deposit');
    document.getElementById('fdDate').value=new Date().toISOString().split('T')[0];
    document.getElementById('fdAmount').value='';
    document.getElementById('fdCDS').value='MYB';
    document.getElementById('fdBank').value='Maybank';
    document.getElementById('fdNotes').value='';
  }
  document.getElementById('fdModal').classList.add('open');
}
function editFund(id){openFdModal(id);}
function closeFdModal(){document.getElementById('fdModal').classList.remove('open');editingFdId=null;}

async function saveFund(){
  const date=document.getElementById('fdDate').value;
  const amount=parseFloat(document.getElementById('fdAmount').value);
  const cds=document.getElementById('fdCDS').value;
  const bank=document.getElementById('fdBank').value.trim();
  const notes=document.getElementById('fdNotes').value.trim();
  const errEl=document.getElementById('fdErr');
  if(!date){errEl.textContent='Select a date.';return;}
  if(!amount||amount<=0){errEl.textContent='Enter a valid amount.';return;}
  const btn=document.getElementById('fdSaveBtn');
  btn.disabled=true;btn.textContent='Saving…';
  const payload={txn_date:date,amount,cds_account:cds,bank_account:bank||null,
    txn_type:fdType,notes:notes||null,updated_at:new Date().toISOString()};
  let error;
  if(editingFdId){({error}=await sb.from('funds').update(payload).eq('id',editingFdId));}
  else{({error}=await sb.from('funds').insert(payload));}
  btn.disabled=false;btn.textContent=editingFdId?'Save Changes':'Save Movement';
  if(error){errEl.textContent=error.message;return;}
  closeFdModal();showToast('Movement saved ✓');loadFunds();
}
async function deleteFund(id){
  const f=funds.find(x=>x.id===id);
  if(!confirm(`Delete ${f.txn_type} of MYR ${fmt(f.amount)} on ${f.txn_date}?`))return;
  const{error}=await sb.from('funds').delete().eq('id',id);
  if(error){showToast('Delete failed');return;}
  showToast('Deleted ✓');loadFunds();
}

document.getElementById('fdModal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeFdModal();});
loadFunds();
</script>
</body>
</html>
