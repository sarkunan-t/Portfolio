<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markets Suite — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="login-wrap">
  <div class="auth-card">
    <div class="auth-logo">&#9632; Markets Suite</div>
    <div class="auth-title">Finance Console</div>
    <div class="auth-sub">Enter your password to continue</div>
    <div class="field" style="margin-bottom:14px;">
      <label>Password</label>
      <input type="password" id="authPassword" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn-primary" id="authBtn" onclick="handleAuth()" style="width:100%;padding:12px;">Unlock</button>
    <div class="auth-msg" id="authMsg"></div>
  </div>
</div>

<script>
const PASS_HASH='60806fd1d4e5822dfc83753ff8a17307323375290c645a270c589c21a05d1ca6';
async function sha256(str){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function handleAuth(){
  const pw=document.getElementById('authPassword').value;
  const btn=document.getElementById('authBtn');
  const msg=document.getElementById('authMsg');
  if(!pw){msg.textContent='Enter your password.';msg.className='auth-msg err';return;}
  btn.disabled=true;btn.textContent='Checking…';
  const hash=await sha256(pw);
  btn.disabled=false;btn.textContent='Unlock';
  if(hash!==PASS_HASH){msg.textContent='Incorrect password.';msg.className='auth-msg err';return;}
  sessionStorage.setItem('pt_auth','1');
  location.replace('dashboard.html');
}
document.getElementById('authPassword').addEventListener('keydown',e=>{if(e.key==='Enter')handleAuth();});
if(sessionStorage.getItem('pt_auth')==='1')location.replace('dashboard.html');
</script>
</body>
</html>
