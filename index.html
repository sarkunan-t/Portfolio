<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Markets Suite</title>
<!-- Markets Suite web site. Runs the same screens as the UnicornHunter Android app (mobile/app/),
     with a desktop layout from mobile/app/web.css. Bump ?v= on every change so browsers reload. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='23' fill='%2300332F'/%3E%3Ccircle cx='50' cy='52' r='30' fill='none' stroke='%2300A19C' stroke-width='6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="mobile/app/app.css?v=20261003d">
<link rel="stylesheet" href="mobile/app/web.css?v=20261003d">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>window.WEB_SITE=true;</script>
</head>
<body class="web">

<!-- ═══ sign in ═══ -->
<div class="login" id="login" hidden>
  <form class="login-card" id="loginForm" autocomplete="on">
    <div class="login-logo"><div class="logo-mark"><svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="23" fill="#00332F"/><circle cx="50" cy="52" r="30" fill="none" stroke="#00A19C" stroke-width="5"/><path d="M50 16V25M50 79V88M14 52H23M77 52H86" stroke="#00A19C" stroke-width="5" stroke-linecap="round"/><g transform="rotate(35 50 52)"><path d="M42 70L50 22L58 70Z" fill="#fff" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><path d="M43.7 60L55.3 54M45.7 48L53.3 42M47.7 36L51.3 30" stroke="#00332F" stroke-width="2.5" stroke-linecap="round"/></g><path d="M79 13L81 19L87 21L81 23L79 29L77 23L71 21L77 19Z" fill="#E8B04A"/></svg></div><div><h1>Markets <span class="logo-accent">Suite</span></h1><p>Portfolio &amp; net worth</p></div></div>
    <label class="fld"><span>Email</span><input type="email" id="lgEmail" autocomplete="username" required></label>
    <label class="fld"><span>Password</span><input type="password" id="lgPass" autocomplete="current-password" required></label>
    <button class="btn btn-p" style="width:100%;margin-top:4px;" id="lgBtn" type="submit">Sign in</button>
    <div class="login-err" id="lgErr"></div>
  </form>
</div>

<!-- ═══ app ═══ -->
<div class="shell" id="shell" hidden>
  <nav class="nav" id="nav"></nav>
  <div class="main">
    <header class="top">
      <div class="top-row">
        <div><h1 id="title">Home</h1><div class="top-sub" id="sub"></div></div>
        <div class="top-actions" id="actions"></div>
      </div>
      <div class="segs" id="segs"></div>
    </header>
    <div class="view" id="view"></div>
  </div>
  <button class="fab" id="fab" hidden><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span id="fabLbl">Add</span></button>
</div>

<div class="sheet-back" id="sheetBack"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="sheet-grab"></div>
  <div class="sheet-head"><div><h3 id="shTitle"></h3><div class="sub" id="shSub"></div></div>
    <button class="icon-btn" id="shClose" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="sheet-body" id="shBody"></div>
  <div class="sheet-foot" id="shFoot"></div>
</section>

<script src="assets/common.js?v=20261003d"></script>
<script src="assets/shares.js?v=20261003d"></script>

<script src="mobile/app/main.js?v=20261003d"></script>
</body>
</html>
