<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Markets Suite — Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Mulish', sans-serif;
      background: #E6F4F3; /* mint background */
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-card {
      background: #FFFFFF;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 51, 47, 0.12);
      padding: 40px 36px;
      width: 100%;
      max-width: 400px;
      border-top: 6px solid #00A19C;
    }

    .brand {
      text-align: center;
      margin-bottom: 32px;
    }

    .brand h1 {
      color: #00332F;
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .brand p {
      color: #00514D;
      font-size: 0.85rem;
      margin-top: 4px;
      font-weight: 600;
    }

    .field { margin-bottom: 18px; }

    .field label {
      display: block;
      color: #00514D;
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .field input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #C5E4E2;
      border-radius: 8px;
      font-family: 'Mulish', sans-serif;
      font-size: 0.95rem;
      color: #00332F;
      background: #F7FCFB;
      transition: border-color 0.15s ease;
    }

    .field input:focus {
      outline: none;
      border-color: #00A19C;
      background: #FFFFFF;
    }

    button[type="button"].signin {
      width: 100%;
      padding: 13px;
      margin-top: 8px;
      background: #00A19C;
      color: #FFFFFF;
      border: none;
      border-radius: 8px;
      font-family: 'Mulish', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    button.signin:hover { background: #00514D; }
    button.signin:disabled { background: #9BCFCD; cursor: wait; }

    .error {
      display: none;
      margin-top: 14px;
      padding: 10px 12px;
      background: #FDECEA;
      border-left: 4px solid #C0392B;
      border-radius: 6px;
      color: #922B21;
      font-size: 0.85rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand">
      <h1>MARKETS SUITE</h1>
      <p>Portfolio &amp; Asset Tracker</p>
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="username" />
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" />
    </div>

    <button type="button" class="signin" id="signinBtn">Sign in</button>

    <div class="error" id="errorBox"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ── Supabase client ──────────────────────────────────────────────
    // Use the SAME URL and anon key as in assets/common.js
    const SUPABASE_URL = 'YOUR_SUPABASE_URL';
    const SUPABASE_ANON_KEY = 'YOUR_ANON_KEY';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const emailEl = document.getElementById('email');
    const passEl = document.getElementById('password');
    const btn = document.getElementById('signinBtn');
    const errBox = document.getElementById('errorBox');

    // If already signed in, skip the login form
    sb.auth.getSession().then(({ data: { session } }) => {
      if (session) window.location.replace('dashboard.html');
    });

    async function signIn() {
      errBox.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Signing in…';

      const { error } = await sb.auth.signInWithPassword({
        email: emailEl.value.trim(),
        password: passEl.value
      });

      if (error) {
        errBox.textContent = error.message === 'Invalid login credentials'
          ? 'Incorrect email or password.'
          : error.message;
        errBox.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Sign in';
        return;
      }

      window.location.replace('dashboard.html');
    }

    btn.addEventListener('click', signIn);
    passEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') signIn(); });
    emailEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') signIn(); });
  </script>
</body>
</html>
